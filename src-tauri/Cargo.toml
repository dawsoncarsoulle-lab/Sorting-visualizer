[package]
name = "sortflow"
version = "0.1.0"
description = "A desktop sorting algorithm visualizer"
authors = ["SortFlow contributors"]
edition = "2024"

[lib]
name = "sortflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

